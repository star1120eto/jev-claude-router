[project]
name = "jev-claude-router"
version = "0.1.0"
description = "指示文をJevで判定し、Claudeのモデルとeffortを自動選択するルーター(非公式)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.9.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "typesafe-sdk>=0.7.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/router"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 実キーが必要なテストは既定で実行しない。実行するときは `pytest -m live`
addopts = "-m 'not live'"
markers = [
    "live: 実際のAPIキーが必要なテスト(CIでは実行しない)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
